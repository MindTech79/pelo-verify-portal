<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELO Certificate Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0f1a;
            --card-bg: rgba(15, 20, 35, 0.75);
            --card-border: rgba(0, 180, 216, 0.25);
            --primary: #00B4D8;
            --success: #00FF88;
            --danger: #EF476F;
            --gold: #C8A450;
            --text-primary: #E8EDF5;
            --text-secondary: #8A99B0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 180, 216, 0.1) 0%, transparent 70%);
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Space Mono', monospace;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: white;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.2);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), #0096C7);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 180, 216, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .result.show { display: block; animation: fadeIn 0.3s ease; }
        .result.success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }
        .result.error {
            background: rgba(239, 71, 111, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        .result.loading {
            background: rgba(0, 180, 216, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            text-align: center;
        }
        .result h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .result .data-row {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            word-break: break-all;
        }
        .result .data-row strong { color: var(--text-primary); }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-family: 'Space Mono', monospace;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> PELO Verification Portal</h1>
            <p>Verify your Certificate of Destruction against the IBM Quantum Anchor.</p>
        </div>

        <div class="card">
            <div class="input-group">
                <label><i class="fas fa-hashtag"></i> Certificate Hash (SHA-256)</label>
                <input type="text" id="certHash" placeholder="Enter 64-character hash..." maxlength="64">
            </div>
            <button class="btn" id="verifyBtn" onclick="verifyCertificate()">
                <i class="fas fa-atom"></i> Verify Quantum Attestation
            </button>
            
            <div class="result" id="result"></div>
        </div>

        <div class="footer">
            ⚛️ CHSH S=2.76 · IBM Kingston · SA Patent 2026/05142
        </div>
    </div>

    <script>
        async function verifyCertificate() {
            const hashInput = document.getElementById('certHash');
            const verifyBtn = document.getElementById('verifyBtn');
            const resultDiv = document.getElementById('result');
            const hash = hashInput.value.trim();

            // Reset UI
            resultDiv.className = 'result';
            resultDiv.innerHTML = '';

            // Validation
            if (hash.length !== 64) {
                resultDiv.className = 'result error show';
                resultDiv.innerHTML = '<h3><i class="fas fa-exclamation-triangle"></i> Invalid Format</h3>Please enter a valid 64-character SHA-256 hash.';
                return;
            }

            // Loading State
            verifyBtn.disabled = true;
            resultDiv.className = 'result loading show';
            resultDiv.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Querying IBM Quantum Anchor...';

            try {
                const response = await fetch('https://pelo-complete.onrender.com/api/v1/attest/certificate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ certificate_hash: hash })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    resultDiv.className = 'result success show';
                    resultDiv.innerHTML = `
                        <h3><i class="fas fa-check-circle"></i> Certificate Verified</h3>
                        This certificate is cryptographically bound to the IBM Quantum hardware.
                        <div class="data-row">
                            <strong>CHSH S:</strong> ${data.quantum_anchor.chsh_s}<br>
                            <strong>IBM Job ID:</strong> ${data.quantum_anchor.ibm_job_id}<br>
                            <strong>Hardware:</strong> ${data.quantum_anchor.hardware}<br>
                            <strong>Signature:</strong> ${data.attestation_signature.substring(0, 32)}...<br>
                            <strong>Timestamp:</strong> ${data.timestamp}
                        </div>
                    `;
                } else {
                    throw new Error(data.detail || 'Verification failed');
                }
            } catch (error) {
                resultDiv.className = 'result error show';
                resultDiv.innerHTML = `
                    <h3><i class="fas fa-times-circle"></i> Verification Failed</h3>
                    ${error.message || 'The certificate hash does not match the quantum anchor, or the backend is unavailable.'}
                `;
            } finally {
                verifyBtn.disabled = false;
            }
        }

        // Allow Enter key to trigger verification
        document.getElementById('certHash').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifyCertificate();
        });
    </script>
</body>
</html>
