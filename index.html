<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELO Certificate Verification</title>

    <!-- Inline favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0f1a; --card-bg: rgba(15, 20, 35, 0.75);
            --card-border: rgba(0, 180, 216, 0.25); --primary: #00B4D8;
            --success: #00FF88; --danger: #EF476F; --gold: #C8A450;
            --text-primary: #E8EDF5; --text-secondary: #8A99B0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Exo 2', sans-serif; background: var(--bg-dark);
            color: var(--text-primary); min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(0, 180, 216, 0.1) 0%, transparent 70%);
        }
        .container { width: 100%; max-width: 600px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 {
            font-size: 2rem; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p { color: var(--text-secondary); font-size: 0.9rem; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--card-border); border-radius: 20px;
            padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block; font-size: 0.75rem; color: var(--text-secondary);
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
            font-family: 'Space Mono', monospace;
        }
        .input-group input {
            width: 100%; padding: 15px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--card-border); border-radius: 10px;
            color: white; font-family: 'Space Mono', monospace;
            font-size: 0.85rem; transition: all 0.3s;
        }
        .input-group input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.2);
        }
        .btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, var(--primary), #0096C7);
            border: none; border-radius: 10px; color: white;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center;
            justify-content: center; gap: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 180, 216, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .result { margin-top: 20px; padding: 20px; border-radius: 10px; display: none; font-size: 0.9rem; line-height: 1.6; }
        .result.show { display: block; animation: fadeIn 0.3s ease; }
        .result.success { background: rgba(0, 255, 136, 0.1); border: 1px solid var(--success); color: var(--success); }
        .result.error { background: rgba(239, 71, 111, 0.1); border: 1px solid var(--danger); color: var(--danger); }
        .result.loading { background: rgba(0, 180, 216, 0.1); border: 1px solid var(--primary); color: var(--primary); text-align: center; }
        .result h3 { margin-bottom: 10px; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .result .data-row {
            font-family: 'Space Mono', monospace; font-size: 0.75rem;
            margin-top: 8px; padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary); word-break: break-all;
        }
        .result .data-row strong { color: var(--text-primary); }
        
        .footer {
            text-align: center; margin-top: 30px; font-size: 0.7rem;
            color: var(--text-secondary); font-family: 'Space Mono', monospace;
        }
        .footer-logos {
            display: flex; justify-content: center; align-items: center;
            gap: 30px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .footer-logo {
            height: 40px; width: auto; opacity: 0.7;
            transition: all 0.3s; object-fit: contain;
        }
        .footer-logo:hover { opacity: 1; transform: scale(1.05); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> PELO Verification Portal</h1>
            <p>Verify your Certificate of Destruction against the IBM Quantum Anchor.</p>
        </div>

        <div class="card">
            <div class="input-group">
                <label><i class="fas fa-hashtag"></i> Certificate Hash (SHA-256)</label>
                <input type="text" id="certHash" placeholder="Enter 64-character hash..." maxlength="64">
            </div>
            <button class="btn" id="verifyBtn" onclick="verifyCertificate()">
                <i class="fas fa-atom"></i> Verify Quantum Attestation
            </button>
            
            <div class="result" id="result"></div>
        </div>

        <div class="footer">
            <div class="footer-logos">
                <img src="https://raw.githubusercontent.com/mindtechindustriesai-alt/my-images/main/pelo_community_final_image-removebg-preview.png" alt="PELO" class="footer-logo" onerror="this.src='https://i.postimg.cc/T114NczG/pelo-recovery-image-removebg-preview.png'">
                <img src="https://i.postimg.cc/zXW78GNH/Mind-Tech-Transparent-Logo.png" alt="MindTech" class="footer-logo" onerror="this.style.display='none'">
            </div>
            <p>⚛️ Canonical: S=2.76 (Kingston) · On-Demand: S=2.02 (Fez) · SA Patent 2026/05142</p>
            <p style="margin-top: 4px;">© 2026 PELO Recovery · Powered by MindTech Industries</p>
        </div>
    </div>

    <script>
        // NEW BACKEND URL
        const BACKEND_URL = 'https://pelo-complete-bm8s.onrender.com';

        async function verifyCertificate() {
            const hashInput = document.getElementById('certHash');
            const verifyBtn = document.getElementById('verifyBtn');
            const resultDiv = document.getElementById('result');
            const hash = hashInput.value.trim();

            // Reset UI
            resultDiv.className = 'result';
            resultDiv.innerHTML = '';

            // Validation
            if (hash.length !== 64) {
                resultDiv.className = 'result error show';
                resultDiv.innerHTML = '<h3><i class="fas fa-exclamation-triangle"></i> Invalid Format</h3>Please enter a valid 64-character SHA-256 hash.';
                return;
            }

            // Loading State
            verifyBtn.disabled = true;
            resultDiv.className = 'result loading show';
            resultDiv.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Querying PELO Ledger...';

            try {
                // Call the new GET /verify/certificate endpoint
                const response = await fetch(`${BACKEND_URL}/api/v1/verify/certificate/${hash}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    signal: AbortSignal.timeout(15000) // 15s for Render cold start
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    const anchors = data.quantum_anchors || {};
                    const canonical = anchors.canonical_proof || {};
                    const replication = anchors.on_demand_replication || {};

                    resultDiv.className = 'result success show';
                    resultDiv.innerHTML = `
                        <h3><i class="fas fa-check-circle"></i> Certificate Verified</h3>
                        This certificate is cryptographically bound to the IBM Quantum hardware.
                        <div class="data-row">
                            <strong>Owner:</strong> ${data.record.owner_name} (${data.record.area})<br>
                            <strong>Volume:</strong> ${data.record.oil_volume}L<br>
                            <strong>Entry ID:</strong> ${data.record.entry_id}<br>
                            <strong>Ledger Timestamp:</strong> ${data.ledger_timestamp || data.issued_at}<br>
                            <hr style="margin: 8px 0; border-color: rgba(255,255,255,0.1);">
                            <strong>Canonical Anchor (IBM Kingston):</strong><br>
                            &nbsp;&nbsp;CHSH S: ${canonical.chsh_s}<br>
                            &nbsp;&nbsp;Job ID: ${canonical.ibm_job_id}<br>
                            &nbsp;&nbsp;Hardware: ${canonical.hardware}<br>
                            &nbsp;&nbsp;Date: ${canonical.date}<br>
                            <strong>On-Demand Replication (IBM Fez):</strong><br>
                            &nbsp;&nbsp;CHSH S: ${replication.chsh_s}<br>
                            &nbsp;&nbsp;Job ID: ${replication.ibm_job_id}<br>
                            &nbsp;&nbsp;Hardware: ${replication.hardware}<br>
                            &nbsp;&nbsp;Date: ${replication.date}<br>
                            <hr style="margin: 8px 0; border-color: rgba(255,255,255,0.1);">
                            <strong>Signature:</strong> ${data.signature.substring(0, 32)}...<br>
                            <strong>Privacy:</strong> ${data.privacy_note || 'Data is not sold. Shared only with Render and Google Cloud.'}
                        </div>
                    `;
                } else if (response.status === 404) {
                    resultDiv.className = 'result error show';
                    resultDiv.innerHTML = `
                        <h3><i class="fas fa-times-circle"></i> Certificate Not Found</h3>
                        This hash was never issued by the PELO ledger. It may be forged or tampered with.
                    `;
                } else if (response.status === 400) {
                    resultDiv.className = 'result error show';
                    resultDiv.innerHTML = `
                        <h3><i class="fas fa-exclamation-triangle"></i> Invalid Hash Format</h3>
                        The hash must be exactly 64 hexadecimal characters (0-9, a-f).
                    `;
                } else if (response.status === 503) {
                    resultDiv.className = 'result error show';
                    resultDiv.innerHTML = `
                        <h3><i class="fas fa-database"></i> Database Unavailable</h3>
                        The PELO ledger is temporarily offline. Please try again in 30 seconds.
                    `;
                } else {
                    throw new Error(data.detail || 'Verification failed');
                }
            } catch (error) {
                resultDiv.className = 'result error show';
                resultDiv.innerHTML = `
                    <h3><i class="fas fa-times-circle"></i> Verification Failed</h3>
                    ${error.message || 'The backend is unavailable or the certificate is invalid.'}
                `;
            } finally {
                verifyBtn.disabled = false;
            }
        }

        // Allow Enter key to trigger verification
        document.getElementById('certHash').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifyCertificate();
        });
    </script>
</body>
</html>
